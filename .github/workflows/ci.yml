name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.docsonly.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect docs-only change
        id: docsonly
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.event.after }}"
          fi

          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || [ -z "$HEAD" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "No comparable base commit (new branch or force-push) — running full checks."
            exit 0
          fi

          CHANGED="$(git diff --name-only "$BASE" "$HEAD")"
          echo "Changed files:"
          echo "$CHANGED"

          if [ -z "$CHANGED" ] || echo "$CHANGED" | grep -qvE '\.md$'; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "Markdown-only diff — skipping install/lint/test (docs/docs-only-changes.md)."
          fi

  lint:
    needs: detect-changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: needs.detect-changes.outputs.docs_only != 'true'
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
        if: needs.detect-changes.outputs.docs_only != 'true'
      - run: pip install -e .[dev]
        if: needs.detect-changes.outputs.docs_only != 'true'
      - run: ruff check .
        if: needs.detect-changes.outputs.docs_only != 'true'
      - run: ruff format --check .
        if: needs.detect-changes.outputs.docs_only != 'true'

  test:
    needs: detect-changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: needs.detect-changes.outputs.docs_only != 'true'
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
        if: needs.detect-changes.outputs.docs_only != 'true'
      - run: pip install -e .[dev]
        if: needs.detect-changes.outputs.docs_only != 'true'
      - run: pytest
        if: needs.detect-changes.outputs.docs_only != 'true'
