# .llm-facts.yml — LLM Facts label source (schema v1).
#
# Formatting only: this file describes a label; it does not verify the data.
# Fill in the sections you have and delete the ones you don't. Every top-level
# key except schema_version is optional — a missing section is omitted from the
# label, never rendered as zero or blank.
#
# Then:
#   llm-facts validate      # schema-check this file
#   llm-facts render        # write llm-facts.png next to it
#   llm-facts render --print  # print a text (Markdown) preview instead

schema_version: 1

